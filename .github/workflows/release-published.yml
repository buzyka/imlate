name: Publish Release Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  extract-version:
    name: Extract version from tag
    # Pinned instead of ubuntu-latest: that label moves to Ubuntu 26.04 between
    # 2026-10-19 and 2026-11-19, and CI should follow on our own schedule.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  publish:
    name: Push to GHCR
    needs: extract-version
    uses: ./.github/workflows/ghcr-build-and-push.yml
    with:
      image_name: buzyka/imlate
      dockerfile: docker/Dockerfile
      version_tag: ${{ needs.extract-version.outputs.version }}
      additional_tags: latest
      build_args: APP_VERSION=${{ needs.extract-version.outputs.version }}
