name: Go Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: 3306
  DATABASE_USERNAME: imlate
  DATABASE_PASSWORD: imlate
  DATABASE_NAME: tracker
  MYSQL_TEST_DATABASE: tracker_test
  MYSQL_ROOT: root

jobs:
  lint:
    name: Run golangci-lint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Go version comes from the toolchain directive in go.mod.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # golangci-lint is pinned in tools/go.mod (updated by Dependabot), so the
      # action runs that binary instead of downloading its own version.
      - name: Install golangci-lint
        working-directory: tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none

  test:
    name: Run Go Tests
    # Pinned rather than ubuntu-latest so the runner image changes only when we
    # change it, not when GitHub moves the alias.
    runs-on: ubuntu-26.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT }}
          MYSQL_USER: ${{ env.DATABASE_USERNAME }}
          MYSQL_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_TEST_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify
        
      - name: Install dependencies for tests
        working-directory: tools
        run: go install -tags 'mysql' github.com/golang-migrate/migrate/v4/cmd/migrate

      - name: Run Migrations
        run: ./scripts/migrate-test-db.sh

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.html
