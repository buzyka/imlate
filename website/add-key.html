<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Info</title>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon.png">

    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: white;
        }
    </style>

</head>

<body>

    <div class="container" style="padding-top: 15px; padding-bottom: 15px;">
        <div class="row">
            <!-- Left column  -->
            <div class="col-6"
                style="background-image: url('assets/img/ISBLogo.jpg'); background-size: cover; background-position: center; min-height: 550px;">
            </div>

            <!-- Right column -->
            <div class="col-6">
                <div class="row mb-3">
                    <div class="col-12">
                        <h2>Add Visitor Key</h2>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <form id="add-key-form">
                            <div class="form-group">
                                <label for="visitor-id">Visitor ID</label>
                                <input type="text" class="form-control" id="visitor-id" placeholder="Enter Visitor ID"
                                    inputmode="numeric" required>
                            </div>
                            <div class="form-group">
                                <label for="visitor-key">Key</label>
                                <input type="text" class="form-control" id="visitor-key"
                                    placeholder="Enter Key" required>
                            </div>
                            <button type="submit" class="btn btn-primary" id="submit-button">Submit</button>
                        </form>
                    </div>
                </div>

                <div id="success-message" class="alert alert-success" role="alert"
                    style="display: none; margin-top: 15px;"></div>
                <div id="error-message" class="alert alert-danger" role="alert"
                    style="display: none; margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('add-key-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const visitorIdInput = document.getElementById('visitor-id');
            const visitorKeyInput = document.getElementById('visitor-key');
            const submitButton = document.getElementById('submit-button');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');

            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';

            const payload = {
                visitor_id: Number(visitorIdInput.value),
                visitor_key: visitorKeyInput.value
            };

            submitButton.disabled = true;

            try {
                const response = await fetch('/api/add-key', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                let data = null;
                try {
                    data = await response.json();
                } catch (parseError) {
                    data = null;
                }

                if (response.ok) {
                    successMessage.textContent = (data && data.message) ? data.message : 'Key successfully added';
                    successMessage.style.display = 'block';
                    visitorIdInput.value = '';
                    visitorKeyInput.value = '';
                    visitorIdInput.focus();
                } else {
                    errorMessage.textContent = (data && data.error) ? data.error : 'Request failed';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Request failed';
                errorMessage.style.display = 'block';
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
