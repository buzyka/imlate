basePath: /
definitions:
  github_com_buzyka_imlate_internal_domain_entity.User:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.UserRole'
      surname:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_buzyka_imlate_internal_domain_entity.UserRole:
    enum:
    - admin
    - terminal
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleTerminal
  github_com_buzyka_imlate_internal_domain_entity.Visitor:
    properties:
      deleted_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      grade:
        type: integer
      id:
        type: integer
      image:
        type: string
      is_student:
        type: boolean
      isams_divisions:
        items:
          type: integer
        type: array
      isams_id:
        type: integer
      isams_school_id:
        type: string
      isams_year_group_id:
        type: integer
      keys:
        items:
          type: string
        type: array
      name:
        type: string
      surname:
        type: string
      updated_at:
        type: string
    type: object
  github_com_buzyka_imlate_internal_isb_adminapi.AuthErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  github_com_buzyka_imlate_internal_isb_adminapi.AuthTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  github_com_buzyka_imlate_internal_isb_adminapi.DashboardResponse:
    properties:
      message:
        type: string
    type: object
  github_com_buzyka_imlate_internal_isb_adminapi.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_buzyka_imlate_internal_isb_adminapi.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_buzyka_imlate_internal_usecase_adminapi.ReportsVisitsResponseItem:
    properties:
      duration_minutes:
        type: integer
      is_student:
        type: boolean
      name:
        type: string
      sign_status:
        type: string
      signed_in:
        type: string
      signed_out:
        type: string
      surname:
        type: string
      visit_date:
        type: string
      visitor_id:
        type: integer
      visits_count:
        type: integer
      year_group:
        type: integer
    type: object
  internal_isb_adminapi.AddKeyRequest:
    properties:
      key:
        type: string
    required:
    - key
    type: object
  internal_isb_adminapi.CreateUserRequest:
    properties:
      name:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.UserRole'
      surname:
        type: string
      username:
        type: string
    required:
    - name
    - password
    - role
    - surname
    - username
    type: object
  internal_isb_adminapi.CreateVisitorRequest:
    properties:
      email:
        type: string
      grade:
        type: integer
      is_student:
        type: boolean
      keys:
        items:
          type: string
        type: array
      name:
        type: string
      surname:
        type: string
    required:
    - name
    type: object
  internal_isb_adminapi.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  internal_isb_adminapi.ManualTrackRequest:
    properties:
      description:
        type: string
      signed_in:
        type: boolean
      visitor_id:
        type: integer
    required:
    - visitor_id
    type: object
  internal_isb_adminapi.ManualTrackResponse:
    properties:
      track_date:
        type: string
      track_type:
        type: string
      visitor:
        $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.Visitor'
    type: object
  internal_isb_adminapi.MessageResponse:
    properties:
      message:
        type: string
    type: object
  internal_isb_adminapi.ReportsVisitsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_buzyka_imlate_internal_usecase_adminapi.ReportsVisitsResponseItem'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        description: total matching records count for the given filters (without pagination)
        type: integer
      total_pages:
        description: total pages count based on total records and page size
        type: integer
    type: object
  internal_isb_adminapi.UpdatePasswordRequest:
    properties:
      password:
        minLength: 6
        type: string
    required:
    - password
    type: object
  internal_isb_adminapi.UpdateUserRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.UserRole'
      surname:
        type: string
    required:
    - name
    - role
    - surname
    type: object
  internal_isb_adminapi.UpdateVisitorRequest:
    properties:
      email:
        type: string
      grade:
        type: integer
      is_student:
        type: boolean
      keys:
        items:
          type: string
        type: array
      name:
        type: string
      surname:
        type: string
    required:
    - name
    type: object
  internal_isb_adminapi.VisitorResponse:
    properties:
      deleted_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      grade:
        type: integer
      id:
        type: integer
      image:
        type: string
      is_student:
        type: boolean
      isams_divisions:
        items:
          type: integer
        type: array
      isams_id:
        type: integer
      isams_school_id:
        type: string
      isams_year_group_id:
        type: integer
      keys:
        items:
          type: string
        type: array
      name:
        type: string
      surname:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the administration API for the ImLate tracking system.
  termsOfService: http://swagger.io/terms/
  title: ImLate Admin API
  version: "2.0"
paths:
  /admin-api/current-user:
    get:
      description: Returns the user resolved from the JWT identity (`id`) in the request
        context.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get current authenticated admin user
      tags:
      - admin-users
  /admin-api/dashboard:
    get:
      description: Returns a simple dashboard welcome message for authenticated admin
        users.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.DashboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get admin dashboard greeting
      tags:
      - admin-dashboard
  /admin-api/reports/visits:
    get:
      description: Returns paginated visitor attendance information aggregated per
        visitor per day for a given date range.
      parameters:
      - description: Start date (YYYY-MM-DD, inclusive)
        in: query
        name: from
        required: true
        type: string
      - description: End date (YYYY-MM-DD, inclusive)
        in: query
        name: to
        required: true
        type: string
      - description: Filter by student flag
        in: query
        name: is_student
        type: boolean
      - description: Filter by year group
        in: query
        name: year_group
        type: integer
      - description: Filter by sign status (not_signed, signed_in, signed_out)
        in: query
        name: sign_status
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Records per page (default 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ReportsVisitsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get visitor attendance report
      tags:
      - admin-reports
  /admin-api/track/visit:
    post:
      consumes:
      - application/json
      description: |-
        Manually records a visitor sign-in/sign-out event on behalf of a visitor by an admin.
        Used when a visitor forgot their key, lost it, or is otherwise unable to use it.
      parameters:
      - description: Track request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_isb_adminapi.ManualTrackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ManualTrackResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Manual visitor track
      tags:
      - admin-tracking
  /admin-api/users:
    get:
      description: Returns all users available in the administration area.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List admin users
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      description: Creates a new user account for the admin panel.
      parameters:
      - description: Create user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_isb_adminapi.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create admin user
      tags:
      - admin-users
  /admin-api/users/{id}:
    delete:
      description: Deletes the user identified by UUID.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete admin user
      tags:
      - admin-users
    get:
      description: Returns one user by UUID.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get user by ID
      tags:
      - admin-users
    put:
      consumes:
      - application/json
      description: Updates profile and role fields for the user identified by UUID.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_isb_adminapi.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_domain_entity.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update admin user
      tags:
      - admin-users
  /admin-api/users/{id}/password:
    put:
      consumes:
      - application/json
      description: Replaces the password of the user identified by UUID.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_isb_adminapi.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update user password
      tags:
      - admin-users
  /admin-api/visitors:
    get:
      description: Returns all visitors available in the administration area.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_isb_adminapi.VisitorResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List visitors
      tags:
      - admin-visitors
    post:
      consumes:
      - application/json
      description: Creates a visitor record with optional keys and student metadata.
      parameters:
      - description: Create visitor request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_isb_adminapi.CreateVisitorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_isb_adminapi.VisitorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create visitor
      tags:
      - admin-visitors
  /admin-api/visitors/{id}:
    delete:
      description: Deletes the visitor identified by numeric ID.
      parameters:
      - description: Visitor ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete visitor
      tags:
      - admin-visitors
    get:
      description: Returns one visitor by numeric identifier.
      parameters:
      - description: Visitor ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.VisitorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get visitor by ID
      tags:
      - admin-visitors
    put:
      consumes:
      - application/json
      description: Updates visitor profile data, including keys and student fields.
      parameters:
      - description: Visitor ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update visitor request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_isb_adminapi.UpdateVisitorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.VisitorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update visitor
      tags:
      - admin-visitors
  /admin-api/visitors/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image file for the specified visitor.
      parameters:
      - description: Visitor ID
        in: path
        name: id
        required: true
        type: integer
      - description: Visitor image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.VisitorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Upload visitor image
      tags:
      - admin-visitors
  /admin-api/visitors/{id}/key:
    post:
      consumes:
      - application/json
      description: Adds one access key to the specified visitor.
      parameters:
      - description: Visitor ID
        in: path
        name: id
        required: true
        type: integer
      - description: Add key request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_isb_adminapi.AddKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Add visitor key
      tags:
      - admin-visitors
  /admin-api/visitors/{id}/key/{key}:
    delete:
      description: Removes one access key from the specified visitor.
      parameters:
      - description: Visitor ID
        in: path
        name: id
        required: true
        type: integer
      - description: Visitor key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_isb_adminapi.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_isb_adminapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Remove visitor key
      tags:
      - admin-visitors
  /login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user with username/password and returns a JWT token.
        Credentials can be sent as JSON or form fields (`username`, `password`).
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthErrorResponse'
      summary: Login for admin API
      tags:
      - auth
  /refresh:
    post:
      consumes:
      - application/json
      description: Refreshes a valid JWT token and returns a new token pair.
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_buzyka_imlate_internal_isb_adminapi.AuthErrorResponse'
      summary: Refresh admin JWT token
      tags:
      - auth
securityDefinitions:
  ApiKeyAuth:
    description: |-
      JWT token in format: "Bearer <JWT>".
      Token lookup order: Authorization header, query parameter `token`, cookie `jwt`.
      Protected admin routes require admin role.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
